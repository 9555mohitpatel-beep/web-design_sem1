<!DOCTYPE html>
<html>
<head>
    <title>Hyperlinks and Images</title>
</head>
<body>

    <h2>Hyperlinks and Images</h2>

    <p>External Link:</p>
    <a href="https://www.google.com" target="_blank">
        Visit Google
    </a>

    <p>Internal Link:</p>
    <a href="#bottom">Go to Bottom</a>

    
    </a>

    <p>Image Link:</p>
    <a href="https://www.example.com" target="_blank">
        <img src="https://via.placeholder.com/100x70?text=Logo"
             alt="College Logo"
             width="100"
             height="70">
    </a>

    <div style="height: 300px;"></div>

    <p id="bottom">You are at the bottom.</p>

    <a href="#">Back to Top</a>

</body>
</html>
