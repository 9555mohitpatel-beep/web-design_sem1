<!DOCTYPE html>
<html>
<head>
    <title>Select, Textarea and Buttons</title>
</head>
<body>

    <form>

        <label for="course">Course:</label>

        <select id="course" name="course">
            <option>ECE</option>
            <option>CSE</option>
            <option>BCA</option>
        </select>

        <br><br>

        <label for="feedback">Feedback:</label>
        <br>

       
        <br><br>

        <button type="submit">Submit</button>

        <button type="reset">Reset</button>

        <button type="button"
                onclick="alert('Button clicked!')">
            Click Me
        </button>

    </form>

</body>
</html>
